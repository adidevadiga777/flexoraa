<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/flexoraa.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO tags -->
  <title>Flexoraa — Turn Your Resume Into a Live AI Portfolio</title>
  <meta name="description"
    content="Upload your resume and photo, and Flexoraa's AI builds you a live, animated portfolio website in seconds. Chat to edit anything. Go live for ₹69 — no coding required." />
  <meta name="keywords"
    content="AI portfolio generator, resume to website, free portfolio builder, AI resume builder, developer portfolio, student portfolio website" />
  <link rel="canonical" href="https://www.flexoraa.in/" />

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.flexoraa.in/" />
  <meta property="og:title" content="Flexoraa — Turn Your Resume Into a Live AI Portfolio" />
  <meta property="og:description"
    content="Upload your resume, get a live AI-built portfolio website in seconds. Chat to edit. Go live for ₹69." />
  <meta property="og:image" content="https://www.flexoraa.in/og-image.png" />
  <meta property="og:site_name" content="Flexoraa" />

  <!-- Twitter/X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Flexoraa — Turn Your Resume Into a Live AI Portfolio" />
  <meta name="twitter:description" content="Upload your resume, get a live AI-built portfolio website in seconds." />
  <meta name="twitter:image" content="https://www.flexoraa.in/og-image.png" />

  <!-- Structured data — helps Google understand what Flexoraa is -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Flexoraa",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "AI-powered tool that turns a resume into a live, animated portfolio website.",
    "offers": {
      "@type": "Offer",
      "price": "69",
      "priceCurrency": "INR"
    },
    "url": "https://www.flexoraa.in"
  }
  </script>
</head>
